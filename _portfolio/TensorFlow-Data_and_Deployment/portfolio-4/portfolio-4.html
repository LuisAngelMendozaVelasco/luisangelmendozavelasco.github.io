<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Object Detection</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@latest/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootswatch@latest/dist/lumen/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@latest/dist/mobilenet.min.js"></script>
    <style>
        /* Image container with light background */
        .image-container {
            max-width: 500px;
            margin: 0 auto;
        }

        .image-container img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Prediction item with left border accent */
        .prediction-item {
            border-left: 4px solid #0066cc;
        }

        /* Probability bar with gradient fill */
        .probability-bar {
            height: 20px;
            background-color: #e9ecef;
            overflow: hidden;
        }

        .probability-fill {
            height: 100%;
            background: linear-gradient(90deg, #0066cc, #0052a3);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 0.75em;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="container py-4">
        <div class="text-center mb-4">
            <h1 class="display-4">Object Detection</h1>
            <p class="lead">Detect objects in images using MobileNet and TensorFlow.js</p>
        </div>

        <div class="row g-4">
            <!-- Testing Section -->
            <div class="col-lg-8 mx-auto">
                <div class="card">
                    <div class="card-body">
                        <h2 class="card-title">Object Detection</h2>
                        <div class="mb-3">
                            <span id="statusBadge" class="badge bg-dark">
                                <span class="spinner-border" id="loadingSpinner" style="display: none;"></span>
                                <span id="statusText">Loading Model...</span>
                            </span>
                        </div>

                        <!-- Image Selection -->
                        <div class="mb-4">
                            <label for="imageSelect" class="form-label">Select an image:</label>
                            <select id="imageSelect" class="form-select">
                                <option value="">-- Choose an image --</option>
                            </select>
                        </div>

                        <!-- Image Display -->
                        <div class="image-container mw-500px mx-auto bg-light border rounded p-2">
                            <img id="selectedImage" src="" alt="Selected image" class="w-100 d-block rounded" style="display: none;">
                            <div id="imagePlaceholder" class="text-muted text-center py-5">
                                Select an image from the dropdown above
                            </div>
                        </div>

                        <!-- Detection Button -->
                        <div class="mt-4 mb-3">
                            <button id="detectBtn" class="btn btn-primary btn-lg w-100" disabled>
                                Detect Objects
                            </button>
                        </div>

                        <!-- Detection Results -->
                        <div id="resultsContainer" class="mt-4" style="display: none;">
                            <h5>Detection Results</h5>
                            <div id="predictionsList"></div>
                        </div>

                        <!-- Info Log -->
                        <div class="mt-4">
                            <h5>Info Log</h5>
                            <div class="bg-light text-dark p-3 rounded" 
                                style="height: 150px; overflow-y: auto; font-family: monospace; font-size: 0.9em;" 
                                id="logPanel">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@latest/dist/js/bootstrap.bundle.min.js"></script>
    <script src="config.js"></script>
    <script src="dom.js"></script>
    <script src="utils.js"></script>
    <script src="model.js"></script>
    <script src="predict.js"></script>
    <script src="ui.js"></script>
    <script src="app.js"></script>
</body>

</html>
